<style>

:root{

  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a1b; --surface:#1b2526; --ink:#e7ebe8; --muted:#9aa7a5; --line:#2c3a3b;
  --river:#0b3a3c; --river-ink:#f3efe4; --marigold:#eaa53a; --marigold-soft:#3a2d16; --danger:#e07a68;
  --c-move:#7fa8d8; --c-food:#e69466; --c-tour:#6dbb94; --c-golf:#a8c75a; --c-stay:#b597d6; --c-free:#a5aaab;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a1b; --surface:#1b2526; --ink:#e7ebe8; --muted:#9aa7a5; --line:#2c3a3b;
  --river:#0b3a3c; --river-ink:#f3efe4; --marigold:#eaa53a; --marigold-soft:#3a2d16; --danger:#e07a68;
  --c-move:#7fa8d8; --c-food:#e69466; --c-tour:#6dbb94; --c-golf:#a8c75a; --c-stay:#b597d6; --c-free:#a5aaab;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--river)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{background:var(--river);color:var(--river-ink)}
header.hero .wrap{padding-block:28px 22px;display:grid;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.15;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;opacity:.9}
.dday{font-family:var(--mono);background:var(--marigold);color:#1d1404;padding:1px 8px;border-radius:4px;font-size:13px}
nav.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.days .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tab{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--muted);font:inherit;padding:6px 12px;border-radius:999px;cursor:pointer;display:grid;line-height:1.2;text-align:center}
.tab b{font-family:var(--mono);font-weight:500;font-size:14px;color:var(--ink)}
.tab small{font-size:11px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab[aria-selected="true"] b{color:var(--bg)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
main .wrap{padding-block:18px 120px;display:grid;gap:28px}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.day-head h2{font-family:var(--display);font-size:22px;margin:0}
.day-head h2 span{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
.add{border:1px dashed var(--muted);background:none;color:var(--ink);font:inherit;font-size:13px;padding:4px 12px;border-radius:6px;cursor:pointer}
.add:hover{border-color:var(--marigold);color:var(--marigold)}
ol.tl{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px}
.item:hover{background:var(--surface)}
.time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;padding-top:1px;color:var(--ink)}
.time.none{color:var(--muted)}
.body{min-width:0;display:grid;gap:3px}
.row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.title{font-weight:600}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;line-height:1.5}
.cat-이동{color:var(--c-move)}.cat-식사{color:var(--c-food)}.cat-관광{color:var(--c-tour)}.cat-골프{color:var(--c-golf)}.cat-숙소{color:var(--c-stay)}.cat-자유{color:var(--c-free)}
.place{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.tbd{font-size:11px;background:var(--marigold-soft);color:var(--marigold);padding:1px 6px;border-radius:4px;font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:14px 4px}
.status{font-size:13px;color:var(--muted)}
.status.warn{color:var(--danger)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:6px;flex-wrap:wrap}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;box-shadow:0 -8px 30px rgb(0 0 0 / .2)}
.sheet .wrap{padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet h3{font-family:var(--display);margin:0;font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.check input{width:auto}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions div{display:flex;gap:8px}
.btn{font:inherit;font-size:14px;border-radius:6px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--river);color:var(--river-ink);border-color:var(--river)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.err{color:var(--danger);font-size:13px}
.hotel{display:grid;gap:10px}
.hotel-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.hotel-card h3{font-family:var(--display);font-size:18px;margin:0}
.hotel-card .sub{font-size:13px;color:var(--muted);margin-top:-6px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.facts dt{color:var(--muted);font-size:12px;padding-top:2px;white-space:nowrap}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.hotel-card a{color:var(--river);font-weight:600}
:root[data-theme="dark"] .hotel-card a{color:var(--marigold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hotel-card a{color:var(--marigold)}}
.mem{cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
.mem:hover{border-color:var(--marigold)}
.fl{display:grid;gap:10px}
.leg{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px;background:var(--bg)}
.leg .lab{font-size:12px;color:var(--muted)}
.leg .no{font-family:var(--mono);font-size:18px;font-weight:500}
.leg .route{font-variant-numeric:tabular-nums;font-size:15px}
.leg .det{font-size:13px;color:var(--muted);white-space:pre-wrap}
.leg.none .no{color:var(--marigold);font-family:var(--body);font-size:15px;font-weight:600}
.crew{display:grid;gap:10px}
.crew-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.crew-head h2{font-family:var(--display);font-size:20px;margin:0}
.crew-head h2 span{font-family:var(--mono);font-size:14px;color:var(--marigold);margin-left:6px}
ul.members{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mem{display:flex;gap:8px;align-items:baseline;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.mem.edit{cursor:pointer}.mem.edit:hover{border-color:var(--marigold)}

.mem .nm{font-weight:600}
.mem .pt{font-size:11px;color:var(--marigold);font-weight:600;overflow-wrap:anywhere}
.mem.add-mem{justify-content:center;border-style:dashed;color:var(--muted);cursor:pointer;background:none;font:inherit;font-size:13px}
.head-count{font-size:12px;color:var(--muted);font-family:var(--body)}

<script>

function renderTabs(){
  const t=$("tabs");t.innerHTML="";
  [["all","전체","5일"],...DAYS.map((d,i)=>[d[0],d[1],`${i+1}일차 ${d[2]}`])].forEach(([k,a,b])=>{

    el.onclick=()=>{sel=k;try{localStorage.setItem("mjr-tab",k)}catch(e){}renderTabs();render()};t.appendChild(el);
  });
}
const inDay=(m,d)=>(m.from||DAYS[0][0])<=d&&d<=(m.to||DAYS[4][0]);
function render(){
  const host=$("days");host.innerHTML="";
  DAYS.filter(d=>sel==="all"||sel===d[0]).forEach(d=>{
    const idx=DAYS.indexOf(d);const sec=document.createElement("section");
    const head=document.createElement("div");head.className="day-head";
    const h=document.createElement("h2");h.textContent=`${idx+1}일차`;const sp=document.createElement("span");sp.textContent=`${d[1]} (${d[2]})${d[3]?" · "+d[3]:""}`;h.appendChild(sp);head.appendChild(h);

    sec.appendChild(head);
    const list=S.items.filter(x=>x.day===d[0]).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")||(a.order||0)-(b.order||0));

    else{const ol=document.createElement("ol");ol.className="tl";
      list.forEach(x=>{const li=document.createElement("li");li.className="item";

        ol.appendChild(li);});
      sec.appendChild(ol);}
    host.appendChild(sec);

}
const dayLabel=k=>{const d=DAYS.find(x=>x[0]===k);return d?`${d[1]}(${d[2]})`:"";};

// save: encrypt state and republish this page
async function save(errEl){

    const json=JSON.stringify(S).replace(/<\//g,"<\\/");

    $("saving").hidden=true;
    if(err?.code==="conflict"){return true;}
    errEl.hidden=false;errEl.textContent=(err?.code==="not_granted"||err?.code==="not_writer")?"수정 권한이 없어 저장되지 않았습니다.":"저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    return false;
  }
}

$("f-day").innerHTML=DAYS.map((d,i)=>`<option value="${d[0]}">${i+1}일차 · ${d[1]} (${d[2]})</option>`).join("");
$("f-cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
const dayOpts=DAYS.map(d=>`<option value="${d[0]}">${d[1]} (${d[2]})</option>`).join("");
$("m-from").innerHTML=dayOpts;$("m-to").innerHTML=dayOpts;
const uid=()=>Math.random().toString(36).slice(2,9);
function arm(btn){if(btn.dataset.armed){return true}btn.dataset.armed="1";btn.classList.add("armed");btn.textContent="한 번 더 누르면 삭제";return false}
function disarm(btn){delete btn.dataset.armed;btn.classList.remove("armed");btn.textContent="삭제"}
function closeAll(){$("scrim").hidden=true;$("sheet").hidden=true;$("msheet").hidden=true;$("fsheet").hidden=true;editing=null;medit=null;}
$("cancel").onclick=closeAll;$("mcancel").onclick=closeAll;$("scrim").onclick=closeAll;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});

function openSheet(x,day){
  editing=x;disarm($("del"));$("ferr").hidden=true;$("sheetTitle").textContent=x?"일정 수정":"일정 추가";
  $("f-day").value=x?x.day:(day||DAYS[0][0]);$("f-time").value=x?.time||"";$("f-title").value=x?.title||"";
  $("f-cat").value=x?.cat||"관광";$("f-place").value=x?.place||"";$("f-note").value=x?.note||"";$("f-tbd").checked=!!x?.tbd;
  $("del").hidden=!x;$("scrim").hidden=false;$("sheet").hidden=false;setTimeout(()=>$("f-title").focus(),30);
}
$("form").addEventListener("submit",async e=>{
  e.preventDefault();const title=$("f-title").value.trim();if(!title)return;
  const data={id:editing?.id||uid(),day:$("f-day").value,time:$("f-time").value,title,cat:$("f-cat").value,place:$("f-place").value.trim(),note:$("f-note").value.trim(),tbd:$("f-tbd").checked,order:editing?.order||Date.now()};
  const prev=S.items;S.items=editing?S.items.map(i=>i.id===editing.id?data:i):[...S.items,data];
  if(!await save($("ferr")))S.items=prev;
});
$("del").onclick=async()=>{if(!arm($("del")))return;const prev=S.items;S.items=S.items.filter(i=>i.id!==editing.id);if(!await save($("ferr")))S.items=prev;};

function openM(m){
  medit=m;disarm($("mdel"));$("merr").hidden=true;$("msheetTitle").textContent=m?"참가자 수정":"참가자 추가";
  $("m-no").value=m?.no||(S.members.length+1);$("m-name").value=m?.name||"";$("m-from").value=m?.from||DAYS[0][0];$("m-to").value=m?.to||DAYS[4][0];$("m-note").value=m?.note||"";$("m-out").value=m?.out||"";$("m-ret").value=m?.ret||"";$("m-local").checked=!!m?.local;
  $("mdel").hidden=!m;$("scrim").hidden=false;$("msheet").hidden=false;setTimeout(()=>$("m-name").focus(),30);
}
$("mform").addEventListener("submit",async e=>{
  e.preventDefault();const name=$("m-name").value.trim();if(!name)return;
  const from=$("m-from").value,to=$("m-to").value;if(to<from){$("merr").hidden=false;$("merr").textContent="귀국일이 합류일보다 빠릅니다.";return;}
  const data={id:medit?.id||uid(),no:Number($("m-no").value)||S.members.length+1,name,from,to,note:$("m-note").value.trim(),out:$("m-out").value.trim().toUpperCase(),ret:$("m-ret").value.trim().toUpperCase(),local:$("m-local").checked};
  const prev=S.members;S.members=medit?S.members.map(m=>m.id===medit.id?data:m):[...S.members,data];
  if(!await save($("merr")))S.members=prev;
});
$("mdel").onclick=async()=>{if(!arm($("mdel")))return;const prev=S.members;S.members=S.members.filter(m=>m.id!==medit.id);if(!await save($("merr")))S.members=prev;};

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderHotel(){
  const h=S.hotel,el=$("hotelCard");if(!h){el.parentElement.hidden=true;return}
  const rows=h.facts.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  el.innerHTML=`<h3>${esc(h.name)}</h3><div class="sub">${esc(h.en)}</div><dl class="facts">${rows}</dl><div>${(h.links||[]).map(l=>`<a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join(" &nbsp; ")}</div>`;
}
function legHtml(label,code,day){
  const f=code&&S.flights?.[code];
  if(!f)return `<div class="leg none"><span class="lab">${label}</span><span class="no">${code?esc(code):"항공편 미정"}</span><span class="det">${esc(dayLabel(day))}${code?"":" 예정 · 확정되면 반영"}</span></div>`;
  return `<div class="leg"><span class="lab">${label} · ${esc(f.date)}</span><span class="no">${esc(f.no)} <span style="font-size:13px;color:var(--muted)">${esc(f.airline)}</span></span><span class="route">${esc(f.dep)} → ${esc(f.arr)}</span><span class="det">${esc(f.det)}</span></div>`;
}
let fmem=null;
function openF(m){
  fmem=m;$("fsheetTitle").textContent=`${m.name} 님 왕복 항공편`;
  const local=m.local;
  $("flBody").innerHTML=local?`<div class="leg none"><span class="lab">항공편</span><span class="no">해당 없음</span><span class="det">${esc(m.note||"현지 합류")} · ${esc(dayLabel(m.from))}~${esc(dayLabel(m.to))} 참석</span></div>`
    :legHtml("가는 편",m.out,m.from)+legHtml("오는 편",m.ret,m.to)+(m.note?`<div class="status">비고: ${esc(m.note)}</div>`:"");
  $("fedit").hidden=!canWrite;$("scrim").hidden=false;$("fsheet").hidden=false;setTimeout(()=>$("fclose").focus(),30);
}
$("fclose").onclick=closeAll;$("fedit").onclick=()=>{const m=fmem;$("fsheet").hidden=true;openM(m)};
</script>
<script>start();</script></body></html>
